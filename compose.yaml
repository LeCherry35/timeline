services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

  agent:
    build: ./agent/${AGENT_HARNESS:-opencode}
    env_file:
      - path: .env
        required: false
